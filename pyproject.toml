[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-tools"
version = "0.2.0"
description = "AI-powered CLI toolkit for content creators."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Takahiro Matsumoto" }
]
dependencies = [
    "typer>=0.16,<1.0",
    "rich>=14,<15",
    "faster-whisper>=1.1,<2.0",
    "google-genai>=1.0,<2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1.0",
    "pytest",
    "ruff",
    "pre-commit",
]

[project.scripts]
anju = "anju.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/anju/commands/*.py" = ["B008"]
